name: release-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  game-checks:
    name: macOS game checks
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Game lib tests
        run: cargo test -p game --lib -- --test-threads=1

      - name: Survivor debug build
        run: cargo build -p game --bin survivor

      - name: Survivor release build
        run: cargo build -p game --bin survivor --release

      - name: Package macOS app and folder
        run: bash scripts/package_macos.sh

      - name: Verify macOS packages
        run: bash scripts/verify_macos_package.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvivors-macos
          path: |
            dist/macos/RustSurvivors
            dist/macos/RustSurvivors.app
