name: release-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  game-checks:
    name: ${{ matrix.os }} game checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Game lib tests
        run: cargo test -p game --lib -- --test-threads=1

      - name: Survivor debug build
        run: cargo build -p game --bin survivor

      - name: Survivor release build
        run: cargo build -p game --bin survivor --release

      - name: Package macOS app and folder
        if: runner.os == 'macOS'
        run: bash scripts/package_macos.sh

      - name: Verify macOS packages
        if: runner.os == 'macOS'
        run: bash scripts/verify_macos_package.sh

      - name: Package Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\package_windows.ps1

      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\verify_windows_package.ps1

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvivors-macos
          path: |
            dist/macos/RustSurvivors
            dist/macos/RustSurvivors.app

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvivors-windows
          path: dist/windows/RustSurvivors
