[package]
name    = "game"
version = "0.1.0"
edition = "2021"

[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "text_demo"
path = "src/bin/text_demo.rs"

[[bin]]
name = "survivor"
path = "src/bin/survivor.rs"

[dependencies]
engine     = { path = "../engine" }
env_logger = { workspace = true }
log        = { workspace = true }
glam     = { workspace = true }
winit    = { workspace = true }
rapier2d = { workspace = true }
wgpu     = { workspace = true }
rand     = { workspace = true }
