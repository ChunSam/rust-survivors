[package]
name        = "game"
version     = "0.1.0"
edition     = "2021"
default-run = "game"

[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "survivor"
path = "src/bin/survivor.rs"

[dependencies]
engine     = { package = "skeleton-engine", path = "../../../skeleton-engine" }
env_logger = { workspace = true }
log        = { workspace = true }
glam     = { workspace = true }
winit    = { workspace = true }
rapier2d = { workspace = true }
wgpu     = { workspace = true }
rand     = { workspace = true }
serde    = { workspace = true }
ron      = { workspace = true }
# Keep a direct rodio dependency for feature unification with engine AudioManager MP3 playback.
rodio    = { workspace = true }
