[package]
name        = "game"
version     = "0.1.0"
edition     = "2021"
default-run = "game"

[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "game"
path = "src/main.rs"

[[bin]]
name = "text_demo"
path = "src/bin/text_demo.rs"

[[bin]]
name = "survivor"
path = "src/bin/survivor.rs"

[dependencies]
engine     = { package = "skeleton-engine", git = "https://github.com/ChunSam/rust-2d-engine" }
env_logger = { workspace = true }
log        = { workspace = true }
glam     = { workspace = true }
winit    = { workspace = true }
rapier2d = { workspace = true }
wgpu     = { workspace = true }
rand     = { workspace = true }
serde    = { workspace = true }
ron      = { workspace = true }
